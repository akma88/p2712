<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 20px;
    }

    h1 { font-size: 36px; }
    h2 { font-size: 30px; }
    h3 { font-size: 24px; }

    button {
      display: block;
      width: 100%;
      min-height: 60px;
      margin: 24px 0;
      padding: 12px;
      background-color: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body id="bodyColor">
  <h1>This is heading 1</h1>
  <h2>This is heading 2</h2>
  <h3>This is heading 3</h3>

  <button type="button" onclick="submitChangeColor()">
    Изменить цвет
  </button>

  <img
    src="https://pbs.twimg.com/media/DnaV3yRU4AA2aEA.jpg"
    alt="Space"
  >

  <script src="script.js"></script>
</body>
</html>
